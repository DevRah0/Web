plugins {
    id 'com.android.application'
}
android {
    namespace 'com.devrah0.hdmioverlay'
    compileSdk 35
    defaultConfig {
        applicationId 'com.devrah0.hdmisubtitles.fresh'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
