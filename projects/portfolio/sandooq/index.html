<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>صندوق التعاون والبركة</title>
<style>
:root{--bg:#fbfaf6;--card:#fff;--tx:#14301f;--mu:#6b6a5e;--gr:#1b5e3a;--go:#c9a24a;--gd:#9c7a2a;--bd:#d9dccf;--in:#fffbe8;--hd:#e3eee6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171a;--card:#1b2227;--tx:#eef1ec;--mu:#9aa39c;--gr:#2f8a58;--bd:#2f3a40;--in:#2a2f22;--hd:#243229}}
:root[data-theme="dark"]{--bg:#12171a;--card:#1b2227;--tx:#eef1ec;--mu:#9aa39c;--gr:#2f8a58;--bd:#2f3a40;--in:#2a2f22;--hd:#243229}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:900px;margin-inline:auto;padding:14px}
.logo{text-align:center}.logo img{width:230px;max-width:60%;border-radius:8px}
.lic{text-align:center;font-weight:bold;font-size:14px;margin:4px 0 14px}
.panel{background:var(--gr);border-bottom:7px solid var(--go);border-radius:16px;padding:16px}
.panel h2{color:#e8cf8a;text-align:center;margin:0 0 12px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.b{font:inherit;font-weight:bold;font-size:18px;color:#14452b;background:linear-gradient(#fff,#dfe9dc);border:2px solid var(--go);border-top-color:#fff3cf;border-bottom:7px solid var(--gd);border-radius:14px;padding:18px 4px 14px;cursor:pointer}
.b:active{border-bottom-width:3px;transform:translateY(4px)}
.top{display:flex;justify-content:space-between;align-items:center;background:var(--gr);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:10px}
.top h1{font-size:20px;margin:0}
.back{font:inherit;font-weight:bold;background:#e6f0e9;color:#14452b;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.sum div{background:var(--hd);border-radius:8px;padding:8px;text-align:center;font-size:13px;color:var(--mu)}.sum b{display:block;font-size:18px;color:var(--tx)}
.w{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{background:var(--hd);padding:7px 4px;font-size:13px}td{border-top:1px solid var(--bd);padding:3px;text-align:center}
td.n{text-align:start;white-space:nowrap;padding-inline:8px;background:rgba(128,128,128,.22)}
td input{width:100%;min-width:52px;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:6px;padding:7px 3px;font:inherit;text-align:center}
td.n input{text-align:start;min-width:150px;background:transparent}
.add{margin:10px 0;font:inherit;font-weight:bold;background:var(--gr);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.x{border:0;background:none;color:#b42318;font-size:18px;cursor:pointer}
.note{color:var(--mu);font-size:12px;text-align:center;margin-top:10px}
</style></head><body>

function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.length===D.length)return s;
 let o=JSON.parse(localStorage.getItem("fund-v2")||"null");if(o&&o.length===D.length)return o.map(r=>r.map(x=>({n:x.n,c:num(x.c),m:num(x.m),a:x.a,b:x.b,d:x.d})))}catch(e){}
 return D.map(r=>r.r.map(x=>({n:x[0],c:x[1],m:x[2],a:"",b:"",d:""})))}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const yr=x=>num(x.a)+num(x.b)+num(x.d),tm=x=>x.m+yr(x),tc=x=>x.c+yr(x)/200,fc=v=>Number.isInteger(v)?v:+v.toFixed(2);
const app=document.getElementById("app");
function home(){
 app.innerHTML=`<div class="logo"><img src="${LOGO}" alt=""></div><div class="lic">المرخص من المركز الوطني لتنمية القطاع غير الربحي برقم (1200805100) وتاريخ 1448/5/25 هـ</div><div class="panel"><h2>اختر السجل</h2><div class="grid">${D.map((r,i)=>`<button class="b" onclick="location.hash='r${i+1}'">${r.t}</button>`).join("")}</div></div>`;
 scrollTo(0,0);
}
function tot(i){const s=S[i];document.getElementById("t1").textContent=s.length;document.getElementById("t2").textContent=f(s.reduce((a,x)=>a+tm(x),0))}
function upd(i,k){const x=S[i][k];document.getElementById("m"+k).value=tm(x);document.getElementById("c"+k).value=fc(tc(x));tot(i)}
function row(i,k){const x=S[i][k];
 const yf=p=>`<td><input inputmode="numeric" value="${x[p]}" oninput="S[${i}][${k}].${p}=this.value;save();upd(${i},${k})"></td>`;
 const nm=D[i].r[k]&&x.n===D[i].r[k][0]?x.n:`<input value="${x.n}" placeholder="الاسم" oninput="S[${i}][${k}].n=this.value;save()">`;
 return `<tr><td>${k+1}</td><td class="n">${nm}</td>
 <td><input id="c${k}" inputmode="decimal" value="${fc(tc(x))}" oninput="S[${i}][${k}].c=num(this.value)-yr(S[${i}][${k}])/200;save();tot(${i})"></td>
 <td><input id="m${k}" inputmode="numeric" value="${tm(x)}" oninput="S[${i}][${k}].m=num(this.value)-yr(S[${i}][${k}]);save();tot(${i})"></td>
 ${yf("a")}${yf("b")}${yf("d")}<td>${k>=D[i].r.length?`<button class="x" onclick="del(${i},${k})">×</button>`:""}</td></tr>`}
function show(i){
 const r=D[i];
 app.innerHTML=`<div class="top"><h1>سجل ${r.t}</h1><button class="back" onclick="location.hash=''">← الرجوع للصفحة الأولى</button></div>
 <div class="sum"><div>المشتركون<b id="t1"></b></div><div>المجموع النهائي<b id="t2"></b></div></div>
 <div class="w"><table><thead><tr><th>#</th><th>الاسم</th><th>الدفعات</th><th>المبلغ</th><th>1448</th><th>1449</th><th>1450</th><th></th></tr></thead><tbody>${S[i].map((_,k)=>row(i,k)).join("")}</tbody></table></div>
 <button class="add" onclick="addr(${i})">+ إضافة مشترك</button> <button class="back" onclick="location.hash=''">← الرجوع للصفحة الأولى</button>
 <div class="note">اكتب المبلغ في خانة العام فيُضاف تلقائيًا إلى المبلغ والدفعات (كل 200 = دفعة) والمجموع. ما تكتبه يُحفظ على هذا الجهاز.</div>`;
 tot(i);scrollTo(0,0);
}
function addr(i){S[i].push({n:"",c:0,m:0,a:"",b:"",d:""});save();show(i);scrollTo(0,document.body.scrollHeight)}
function del(i,k){if(confirm("حذف هذا الصف؟")){S[i].splice(k,1);save();show(i)}}
function route(){const m=location.hash.match(/^#r(\d+)$/);const i=m?+m[1]-1:-1;if(i>=0&&i<D.length)show(i);else home()}
addEventListener("hashchange",route);route();
</script></body></html>
