name: Build GameTranslator TCL compatibility APK
on:
  push:
    branches:
      - gametranslator-v170-tcl-compat
    paths:
      - "GameTranslator-TCL/**"
      - ".github/workflows/build-gametranslator-tcl.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build unchanged original UI with TCL native HDMI compatibility layer
        run: gradle --no-daemon -p GameTranslator-TCL/tv/android :app:assembleRelease
      - name: Verify installability, package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="GameTranslator-TCL/tv/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" | tail -1
          cp "$APK" GameTranslator-TCL-v1.7.0-HDMI-Fix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-TCL-v1.7.0-HDMI-Fix
          path: GameTranslator-TCL-v1.7.0-HDMI-Fix.apk
          if-no-files-found: error
